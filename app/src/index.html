<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
        <meta
            http-equiv="Content-Security-Policy"
            content="script-src 'self' 'unsafe-inline';"
        />
        <link rel="stylesheet" href="styles.css" />
        <title>name of app</title>
    </head>
    <body>
        <div class="create-user hidden" inert="true">
            <form id="signup-form">
                <h1>Sign in</h1>
                <div>
                    <input type="text" id="username" name="username" placeholder="Enter username" required />
                </div>
                <div>
                    <input type="password" id="password" name="password" placeholder="Enter password" required />
                </div>
                <button type="submit">Sign in</button>
            </form>
            <div class="background-blur"></div>
        </div>
        <div id="layout">
            <nav id="sidebar">
                <div>
                    <span id="account" inert="true"></span>
                    <button id="expand-sidebar-button" onclick="expandSidebar()">
                        <span>⨠</span>
                    </button>
                </div>
                <ul id="chat-history" class="hidden open" inert="true">
                    <li id="chat-history-summary" class="rotate" onclick="expandChatHistory(event)">History</li>
                </ul>
            </nav>
            <main id="main"></main>
        </div>
    </body>
    <script type="text/javascript" src="./app.js"></script>
    <!-- <script type="text/javascript" src="./user-login.js"></script> -->
    <script type="text/javascript" src="./sidebar.js"></script>
    <script type="module" src="./renderer.js"></script>
    <script src="../node_modules/pdfjs-dist/build/pdf.mjs" type="module"></script>
    <script src="../node_modules/split-grid/dist/split-grid.js" type="module"></script>
</html>
