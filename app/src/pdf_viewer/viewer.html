<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta 
            http-equiv="Content-Security-Policy"
            content="script-src 'self' 'unsafe-inline';"
        />
        <link rel="stylesheet" href="viewer.css">
        <title>pdf-viewer</title>
    </head>
    <body>
        <main>
            <div id="pdf-container">
                <div id="toolbar">
                    <div id="toolbar-left-group">
                        <button id="prev-page" title="Previous Page" tabindex="0">
                            <img src="./assets/page-up.svg" alt="">
                        </button>
                        <button id="next-page" title="Next Page" tabindex="0">
                            <img src="./assets/page-down.svg" alt="">
                        </button>
                        <input type="text" name="" id="page-number" value="1" autocomplete="off" title="page" tabindex="0">
                        <span id="num-pages"></span>
                    </div>
                </div>
                <div id="viewer-container"></div>
            </div>
        </main>
    </body>
    <script type="module", src="../../node_modules/pdfjs-dist/build/pdf.mjs"></script>
    <script type="module" src="viewer.js"></script>
    <script type="module">
        import { newPDFViewer } from './viewer.js';

        const pdfUrl = "test.pdf";
        const pageContainer = document.getElementById('viewer-container');

        newPDFViewer(pdfUrl, pageContainer);
    </script>
</html>
