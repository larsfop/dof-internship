# --- RAG CONFIG ---
[rag_config]
embedding_model = "text-embedding-3-large"
embedding_dimensions = 3072
collection_name = "document_store"
index_type = "FLAT"
metric_type = "cosine"
search_type = "similarity"
score_threshold = 0.95

[rag_config.search_kwargs]
k = 5
# score_threshold = 0.1

[rag_config.llm_models]
summary_model = { model = "gpt-4.1" }
retriever_model = { model = "gpt-4.1", kwargs = { temperature = 0 } }
response_model = { model = "o4-mini" }


# --- DOCUMENT PARTITION CONFIG ---
[partition_config]
pdf_dir_path = "../data/pdfs/" # Default directory for documents on volume
output_dir_path = "../data/partitions/"

# Unstructured data partitioning configuration
strategy = "hi_res"
crop = [ 38, 50, 563, 785 ]

# AI model for partitioning (e.g. for table extraction)
llm_model = { model = "o4-mini", kwargs = { service_tier = "flex" } }

# Documents to include from the mounted directories (supports glob patterns), (only pdfs are supported)
# Files are searched recursively
# Examples: "*.pdf", "eurocodes/*.pdf", "ns*.pdf", "ns*1995*.pdf"
documents = [
    "ns*.pdf",
    "SOFiSTiK/*.pdf",
]


# --- LOGGER CONFIG ---
[logger_config]
version = 1
disable_existing_loggers = false

[logger_config.formatters.simple]
format = "%(asctime)s - %(levelname)s: %(message)s"
datefmt = "%Y-%m-%d %H:%M:%SZ"

# [logger_config.formatters.json]
# "()" = "mylogger.MyJSONFormatter"
# 
# [logger_config.formatters.json.fmt_keys]
# level = "levelname"
# message = "message"
# timestamp = "timestamp"
# logger = "name"
# module = "module"
# function = "funcName"
# line = "lineno"
# thread_name = "threadName"

[logger_config.handlers.stderr]
class = "logging.StreamHandler"
level = "INFO"
formatter = "simple"
stream = "ext://sys.stderr"

